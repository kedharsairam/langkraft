name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Content lint
        run: node pipeline/lint.mjs
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Permission gate (no INTERNET)
        run: |
          APK=$(find app/build/outputs -name "app-debug.apk" | head -1)
          PERMS=$(aapt dump permissions "$APK" || echo "")
          echo "$PERMS"
          if echo "$PERMS" | grep -qi "INTERNET"; then echo "FAIL: INTERNET permission found"; exit 1; fi
          echo "Permission gate OK (no INTERNET)"
      - name: Size gate (text-only <5MB)
        run: |
          APK=$(find app/build/outputs -name "app-debug.apk" | head -1)
          ls -lh "$APK"
