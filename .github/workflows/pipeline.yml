name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Content lint
        run: node pipeline/lint.mjs
      - name: Hard content gate (all 19 languages)
        run: |
          for c in spa ind por hin fra ara cmn swh rus vie tha tur jpn kor deu ita fas srp tam; do
            python3 pipeline/validate_content.py "$c" || exit 1
          done
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug + release
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Permission gate (no INTERNET in either APK)
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for APK in $(find app/build/outputs/apk -name '*.apk'); do
            echo "Checking $APK"
            PERMS=$("$AAPT" dump permissions "$APK")
            echo "$PERMS"
            if echo "$PERMS" | grep -qi "INTERNET"; then
              echo "FAIL: INTERNET permission found in $APK"
              exit 1
            fi
          done
          echo "Permission gate OK (no INTERNET in any APK)"
      - name: Signature gate (release APK signed)
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          RELEASE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$APKSIGNER" verify --print-certs "$RELEASE"
          echo "Release APK is signed"
      - name: Size gate (release < 5 MB)
        run: |
          set -e
          RELEASE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          BYTES=$(stat -c %s "$RELEASE")
          echo "Release APK: $BYTES bytes"
          if [ "$BYTES" -ge 5242880 ]; then echo "FAIL: release APK over 5 MB"; exit 1; fi
          echo "Size gate OK"
