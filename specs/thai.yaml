review:
  flags_received: 0
  last_reviewed: null
  known_gaps:
    - "NO TONE CONTENT IS AUTHORED YET, despite this being the whole reason Thai was chosen. The tone stage has a schema, a linter, a UI and a test fixture, and has still never been rendered on a device. This is the largest single gap in the project and it is on the language that was picked to close exactly this gap."
    - "No native Thai speaker has reviewed any of this. The register analysis is sourced and the particle meanings are verified, but no sentence has been read by a Thai speaker. Same class of risk as Swahili and Tamil, and larger: Thai has a register system where being wrong is a social error, not a misunderstanding."
    - "coverage.territories and variety.fails_in are recorded as UNKNOWN. An empty fails_in here means unknown, and must not be read as the English finding of 'fails nowhere'. English can make that claim; Thai cannot yet."
    - "The polite particle is a gender slot the user must fill by choosing a variant. There is no verified neutral form, the app cannot know the user's gender, and the rules forbid asking. The interaction between that constraint and Thai's register system is UNRESOLVED."
    - "The content schema has no slots, so 'I don't speak Thai' / 'Do you speak English?' cannot be templated. In Thai this is the phrase that sets the register of the whole interaction, which makes the missing slots concept more costly here than in any other language."
    - "No country pack for Thailand, which is the single largest travel market for a first language in this catalogue."
    - "No commercial phrasebook has been read. Six are catalogued; contents unverified; nothing lifted."
    - "RTGS publisher is recorded as an unresolved conflict between the Royal Institute of Thailand and the Royal Society of Thailand."
