      note: "One reviewer, no second reader — same weakness as English Tier 0, and recorded here rather than only in the knowledge base."

romanization_note:
  scheme: RTGS
  full_name: "Royal Thai General System of Transcription"
  value: >
    RTGS is the official THAI NATIONAL romanization, published by the Royal
    Institute of Thailand. It is almost identical to ISO 11940-2, and the two are
    distinct systems; the international machine-readable standard is ISO 11940, not
    RTGS.
  source: "https://en.wikipedia.org/wiki/Royal_Thai_General_System_of_Transcription"
  verified: true
  checked: 2026-10-04
  lossy: true
  lossiness:
    value: >
      RTGS is LOSSY and non-reversible. The 1932 committee explicitly considered
      tone and quantity marks "unneeded" and left them out. So RTGS cannot
      distinguish the five tones, cannot distinguish short from long vowels, and
      merges IPA /o/ with /ɔ/ and /tɕ/ with /tɕʰ/.

      This is the single most important fact in this file for the tone stage. If
      the romanization carries no tone, the tone number shown beside each variant
      is the ONLY machine-readable carrier of the contrast, which is why the UI
      shows it explicitly and why the tone stage exists at all.
    source: "https://en.wikipedia.org/wiki/Romanization_of_Thai"
    verified: true
    checked: 2026-10-04
  warning:
    value: >
      A TONE-MARKED romanization using circumflex accents (khráp, khá, mâi bpen rai)
      is a widely used TEACHING convention and is NOT RTGS. Under RTGS these are
      khrap, kha, mai pen rai. Verified by running an RTGS implementation against
      its own published examples first, then against these words. This spec uses
      RTGS and shows tone numbers separately; it does not mix the two conventions,
      because a romanization that half-marks tone is the worst of both.
    source: "internal, cross-checked against https://en.wikipedia.org/wiki/Royal_Thai_General_System_of_Transcription"
    verified: true
    checked: 2026-10-04
  publisher_conflict:
    value: >
      UNRESOLVED. The RTGS article attributes it to the Royal Institute of Thailand;
      Wikidata records the standards body as the Royal Society of Thailand. These
      are different bodies and the scheme's own Thai name contains ราชบัณฑิตยสถาน,
      literally "of the Royal Society". Wikipedia is also internally inconsistent,
      giving 1917 in its lead and 1932 in its history section. Recorded as
      unresolved rather than picked.
    source: "https://www.wikidata.org/wiki/Q1268261 vs https://en.wikipedia.org/wiki/Royal_Thai_General_System_of_Transcription"
    verified: false
    checked: 2026-10-04

tone_note:
  count: 5
  names: [mid, low, falling, high, rising]
  source: "https://en.wikipedia.org/wiki/Thai_language"
  verified: true
  checked: 2026-10-04
  dispute:
    value: >
      Some early accounts posit a SIXTH tone, a glotally-constricted high tone. There
      is agreement on the labels Low, Mid, High, Rising, Falling. The dispute is over
      the HIGH tone, NOT over the mid tone.
    source: "Slayden, 'Central Thai Phonology', 2009, http://www.thai-language.com/resources/slayden-thai-phonology.pdf"
    verified: true
    checked: 2026-10-04
    note: "Corrects an assumption recorded in the research brief for this spec, which had placed the dispute in the wrong tone."
  live_syllable_rule:
    value: >
      CRITICAL FOR THE TONE STAGE. The full five-way complement exists only in LIVE
      syllables — those ending in a long vowel or a sonorant /m n ŋ j w/. DEAD
      syllables (short vowel, or plosive-final) carry only THREE tonal distinctions:
      low, high, falling.

      So every minimal-pair set in the content must use live syllables. A set built
      from dead syllables would silently teach a contrast that does not exist.
    source: "https://en.wikipedia.org/wiki/Thai_language"
    verified: true
    checked: 2026-10-04
  consonant_class_rule:
    value: >
      THE TONE NUMBER CANNOT BE READ OFF THE MARK. This is the correction that matters
      most for the tone stage, and it is the thing most Thai-learning material gets
      wrong.

      Thai consonants belong to three classes, and the same mark yields a DIFFERENT tone
      depending on which class the INITIAL consonant belongs to:

        | mark           | mid class (ก จ ฎ ฏ ด ต บ ป อ) | high class (ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห) | low class (everything else) |
        |----------------|------------------------------|--------------------------------|-----------------------------|
        | none, live     | 1 mid                        | 5 RISING                      | 1 mid                       |
        | ่ mai ek       | 2 low                        | 2 low                         | 3 FALLING                   |
        | ้ mai tho      | 3 falling                    | 3 falling                     | 4 HIGH                      |
        | ๊ mai tri      | 4 high                       | 4 high                        | 4 high                      |
        | ๋ mai chattawa | 5 rising                     | 5 rising                      | 5 rising                    |

      Consequences the tone stage must not hide:
        - "No mark = mid tone" is true ONLY of mid-class initials. For a high-class
          initial, no mark is RISING: ขาว 'white' is tone 5, not tone 1.
        - For a low-class initial, mai ek is FALLING not low, and mai tho is HIGH not
          falling: ค่ำ 'evening' is tone 3, ค้ำ 'to support' is tone 4.

      Because the numbering is contested in the popular literature — many Thai schools
      and culture posts label ขาว as mid and ข้าว as high — the tone stage ships
      mid-class-initial sets as its core, where the textbook numbering is exactly right,
      and includes high-class and low-class sets precisely to mark the disagreement
      rather than to hide it.
    source: "http://www.thai-language.com/ref/tone-rules; https://th.wikipedia.org/wiki/อักษรไทย; https://en.wiktionary.org/wiki/Module:th-pron; corroborated by the native example set คา ข่าว ข้า/ค่า ค้า ขา with IPA"
    verified: true
    checked: 2026-10-04
    note: >
      Cross-validated with a computer built from these rules against 61 test cases with
      zero mismatches, including the Wikipedia native example set above. This finding
      CORRECTS an assumption recorded earlier in this file's research, which held that
      a mark maps to one fixed tone.

  mark_and_length_cooccur:
    value: >
      A tone mark and the vowel-length mark ั DO combine in one syllable. Verified
      empirically against the en-th bitext: 162 occurrences across 13 distinct
      syllables. Clean examples: นั่ง (to sit) = NO + ั + ่ + ง, and ตั้ง (to stand,
      set up) = TO + ั + ้ + ง.
    source: "computed over Tatoeba v2026-07-08 en-th TMX; codepoints U+0E19 U+0E31 U+0E48 U+0E07 and U+0E15 U+0E31 U+0E49 U+0E07"
    verified: true
    checked: 2026-10-04

attribution:
  - source: "Wikivoyage contributors"
    licence: "CC BY-SA 4.0"
