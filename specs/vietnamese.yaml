review:
  known_gaps:
    - id: vie-gap-001
      claim: >
        Vietnamese Tier 0 is built by selection from two harvested corpora, not by a native
        speaker reviewing it. Semantic correctness, register and whether a local would actually
        say a phrase are NOT verified, and no mechanical check can verify them.
      consequence: >
        Tier 0 ships with evidence recorded per entry so a flagged phrase can be traced back to
        its source and its author.
    - id: vie-gap-002
      claim: >
        Vietnamese tone is determined by the vowel nucleus and, pre-1991, by the initial consonant. Southern speakers widely apply the older system, so the same spelling can be read two ways.
      consequence: >
        None beyond the general Tier 0 verification gap.

  reviews: []
