      verified: false
      checked: 2026-10-05
      note: >
        DERIVED FROM MEASURED YIELD, not chosen. 56 usable candidates across
        10 corroborated phrases. The floor follows the evidence because a
        constant size would be wrong in both directions — asking for more than exists, or writing
